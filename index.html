    :root {

      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --hero: linear-gradient(270deg, #e11d64 0%, #4a185a 55%, #0f1740 100%);
      --status-bg: #101840;
      --btn-grad: linear-gradient(270deg, #e11d48 0%, #db2777 100%);
      --accent: #e11d48;
      --accent-soft: rgba(225, 29, 72, 0.10);
      --chip-border: #f43f5e;
      --chip-bg: #fff1f2;
      --shadow: 0 10px 26px -10px rgba(15, 23, 64, 0.16);
    }
    body[data-theme="sky"] {
      --bg: #eef6ff;
      --hero: linear-gradient(270deg, #0284c7 0%, #1d4ed8 55%, #0f1740 100%);
      --status-bg: #0c234a;
      --btn-grad: linear-gradient(270deg, #0284c7 0%, #2563eb 100%);
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.12);
      --chip-border: #0ea5e9;
      --chip-bg: #f0f9ff;
    }
    body[data-theme="mint"] {
      --bg: #ecfdf5;
      --hero: linear-gradient(270deg, #059669 0%, #0f766e 55%, #0f292e 100%);
      --status-bg: #09302c;
      --btn-grad: linear-gradient(270deg, #059669 0%, #0d9488 100%);
      --accent: #059669;
      --accent-soft: rgba(5, 150, 105, 0.12);
      --chip-border: #10b981;
      --chip-bg: #ecfdf5;
    }
    body[data-theme="royal"] {
      --bg: #f4f0ff;
      --hero: linear-gradient(270deg, #7c3aed 0%, #4f46e5 55%, #17123b 100%);
      --status-bg: #1a1347;
      --btn-grad: linear-gradient(270deg, #7c3aed 0%, #9333ea 100%);
      --accent: #7c3aed;
      --accent-soft: rgba(124, 58, 237, 0.12);
      --chip-border: #8b5cf6;
      --chip-bg: #f5f3ff;
    }
    body[data-theme="navy"] {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #293548;
      --hero: linear-gradient(270deg, #1e3a8a 0%, #172554 55%, #090d16 100%);
      --status-bg: #131d3b;
      --btn-grad: linear-gradient(270deg, #2563eb 0%, #4f46e5 100%);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --chip-border: #38bdf8;
      --chip-bg: #1e293b;
      --shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.55);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 88px;
      transition: background .22s ease, color .22s ease;
    }
    .font-math { font-family: 'IBM Plex Mono', monospace; direction: ltr; unicode-bidi: embed; }
    .tabular { font-variant-numeric: tabular-nums; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }

    .container { width: 100%; max-width: 680px; margin: 0 auto; padding: 12px 16px 20px; }

    .hero-banner {
      background: var(--hero);
      color: #fff;
      border-radius: 26px;
      padding: 14px 16px;
      box-shadow: 0 14px 30px -10px rgba(15, 23, 64, 0.42);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .icon-circle {
      width: 39px;
      height: 39px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      position: relative;
      transition: transform .16s ease, background .16s ease;
    }
    .icon-circle:hover { transform: scale(1.07); background: rgba(255, 255, 255, 0.24); }
    .badge-dot {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      border-radius: 999px;
      background: #fbbf24;
      color: #0f172a;
      font-size: 10px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .brand-center { text-align: center; flex: 1; }
    .brand-title { font-size: 25px; font-weight: 900; letter-spacing: -0.4px; line-height: 1.1; }
    .brand-title .gold { color: #fbbf24; }
    .brand-sub { font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.88); margin-top: 2px; }

    .status-capsule {
      margin-top: 11px;
      width: 100%;
      background: var(--status-bg);
      color: #fff;
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: var(--shadow);
    }
    .status-capsule .gold { color: #fcd34d; }
    .status-sep { opacity: .3; }

    .apk-banner {
      margin-top: 10px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .btn-primary {
      background: var(--btn-grad);
      color: #fff;
      padding: 8px 14px;
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 6px 14px -6px rgba(15, 23, 64, 0.35);
    }
    .btn-primary:hover { filter: brightness(1.07); }
    .btn-outline {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-outline:hover { border-color: var(--accent); background: var(--accent-soft); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 15px;
      box-shadow: var(--shadow);
      margin-top: 13px;
    }
    .section-title {
      font-size: 16.5px;
      font-weight: 900;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .themes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
    .theme-chip {
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .theme-chip.active {
      border-color: var(--chip-border);
      background: var(--chip-bg);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .search-wrap { position: relative; margin-top: 13px; }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 17px;
      padding: 11px 40px 11px 14px;
      font-size: 13.5px;
      font-weight: 700;
      outline: none;
      box-shadow: var(--shadow);
    }
    .search-input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }

    .subject-card {
      width: 100%;
      text-align: right;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 21px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 10px;
      box-shadow: var(--shadow);
      transition: transform .15s ease, border-color .15s ease;
    }
    .subject-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .subject-icon {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      flex-shrink: 0;
    }
    .subject-meta { flex: 1; min-width: 0; }
    .subject-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .subject-name { font-size: 16.5px; font-weight: 900; }
    .subject-pct { font-size: 12px; font-weight: 800; color: var(--accent); }
    .subject-sub { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 2px; }
    .progress-track {
      height: 7px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 7px;
    }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--btn-grad); transition: width .35s ease; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
    .filter-pill {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 800;
    }
    .filter-pill.active { background: var(--btn-grad); color: #fff; border-color: transparent; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    @media (max-width: 480px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .unit-box {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 19px;
      padding: 13px;
      margin-top: 11px;
    }
    .lesson-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding: 9px 11px;
      border-radius: 13px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .vocab-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
    .vocab-table th, .vocab-table td { border: 1px solid var(--border); padding: 7px 9px; text-align: right; }
    .vocab-table th { background: var(--accent-soft); color: var(--accent); font-weight: 900; }
    .vocab-table tr:nth-child(even) td { background: var(--surface-2); }
    .point-list { margin: 8px 0 0; padding-right: 18px; line-height: 1.8; font-size: 13.5px; font-weight: 600; }

    .option-btn {
      width: 100%;
      text-align: right;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 15px;
      padding: 11px 13px;
      font-size: 13.5px;
      font-weight: 700;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
    .option-btn.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.14); color: #059669; }
    .option-btn.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.14); color: #dc2626; }
    .option-letter {
      width: 27px;
      height: 27px;
      border-radius: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .explanation-box {
      margin-top: 11px;
      padding: 11px 13px;
      border-radius: 13px;
      background: var(--surface-2);
      border-right: 4px solid var(--accent);
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.7;
    }
    .math-box {
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 11px;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .leader-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 13px;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      margin-top: 8px;
    }
    .leader-row.me { border-color: var(--accent); background: var(--accent-soft); }
    .rank-num {
      width: 29px;
      height: 29px;
      border-radius: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12.5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.08);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav-inner {
      max-width: 680px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 5px;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 4px;
      border-radius: 13px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
    }
    .nav-btn.active { color: var(--accent); background: var(--accent-soft); }
    .nav-btn .ico { font-size: 17px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 6, 23, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 23px;
      padding: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      max-height: 90vh;
      overflow-y: auto;
    }
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-130%);
      z-index: 80;
      background: #0f172a;
      color: #fcd34d;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
      transition: transform .24s ease;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .kemo-footer {
      margin-top: 20px;
      text-align: center;
      padding: 13px;
      border-radius: 19px;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .kemo-footer-word {
      font-size: 17px;
      font-weight: 900;
      background: linear-gradient(90deg, #e11d64, #f59e0b, #7c3aed, #0284c7, #e11d64);
      background-size: 200% auto;
      -webkit-background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }
  </style>
</head>

      function getTotalLessonsCount() {
        var c = 0;
        SUBJECTS.forEach(function (s) { s.units.forEach(function (u) { c += u.lessons.length; }); });
        return c;
      }

      function getOverallProgressPct() {
        var total = getTotalLessonsCount();
        var done = Object.keys(state.completedLessons).filter(function (k) { return state.completedLessons[k]; }).length;
        return total ? Math.round((done / total) * 100) : 0;
      }

      function getSubjectProgress(subj) {
        var total = 0, done = 0;
        subj.units.forEach(function (u) {
          u.lessons.forEach(function (l) {
            total++;
            if (state.completedLessons[l.id]) done++;
          });
        });
        return { done: done, total: total, pct: total ? Math.round((done / total) * 100) : 0 };
      }

      function getLeaderboard() {
        var list = SEED_LEADERS.map(function (x) { return Object.assign({}, x, { isMe: false }); });
        list.push({
          id: 'me',
          name: state.studentName || 'طالب جديد (أنت)',
          avatar: state.studentAvatar || '🎓',
          points: state.points,
          exams: state.examsTaken,
          isMe: true
        });
        list.sort(function (a, b) { return b.points - a.points; });
        return list;
      }

      function getMyRank() {
        var list = getLeaderboard();
        for (var i = 0; i < list.length; i++) {
          if (list[i].isMe) return i + 1;
        }
        return null;
      }

      function shuffleArray(arr, seedOffset) {
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.abs(Math.sin((i + 1) * (seedOffset + 1)) * 10000)) % (i + 1);
          var tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }

      function shuffleQuestionOptions(q, seedOffset) {
        var tagged = q.options.map(function (opt, idx) {
          return { text: opt, isCorrect: idx === q.correctIndex };
        });
        var mixed = shuffleArray(tagged, seedOffset + q.id.length);
        var newCorrect = 0;
        for (var i = 0; i < mixed.length; i++) {
          if (mixed[i].isCorrect) newCorrect = i;
        }
        return {
          id: q.id,
          subjectId: q.subjectId,
          skill: q.skill,
          math: q.math || '',
          prompt: q.prompt,
          options: mixed.map(function (m) { return m.text; }),
          correctIndex: newCorrect,
          explanation: q.explanation
        };
      }

      function startExam(title, pool, limit, mode, subjectId, lessonId) {
        ui.examSeedCounter++;
        var mixedPool = shuffleArray(pool, ui.examSeedCounter * 7 + Date.now() % 97);
        var chosen = mixedPool.slice(0, Math.min(limit, mixedPool.length)).map(function (q, idx) {
          return shuffleQuestionOptions(q, ui.examSeedCounter + idx);
        });
        ui.examState = {
          title: title,
          pool: pool,
          limit: limit,
          mode: mode,
          subjectId: subjectId || null,
          lessonId: lessonId || null,
          questions: chosen,
          index: 0,
          answers: {},
          earnedThisExam: 0,
          finished: false
        };
        ui.view = 'exam-runner';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderExamRunner() {
        var ex = ui.examState;
        if (!ex) { ui.view = 'exams'; renderExamsHub(); return; }

        if (ex.finished) {
          var total = ex.questions.length;
          var correctCount = 0;
          ex.questions.forEach(function (q, idx) {
            if (ex.answers[idx] === q.correctIndex) correctCount++;
          });
          var pct = total ? Math.round((correctCount / total) * 100) : 0;

          var html =
            '<section class="card" style="text-align:center;">' +
              '<div style="font-size:44px;">' + (pct >= 80 ? '🏆' : pct >= 50 ? '🌟' : '💪') + '</div>' +
              '<h2 style="margin:6px 0;font-size:20px;font-weight:900;">نتيجة الامتحان</h2>' +
              '<div style="font-size:13px;color:var(--muted);font-weight:700;">' + escapeHtml(ex.title) + '</div>' +
              '<div style="margin:14px auto;padding:14px;border-radius:18px;background:var(--surface-2);border:1px solid var(--border);max-width:340px;">' +
                '<div class="font-math tabular" style="font-size:28px;font-weight:900;color:var(--accent);">' + correctCount + ' / ' + total + ' (' + pct + '%)</div>' +
                '<div style="font-size:13.5px;font-weight:900;color:#d97706;margin-top:4px;">حصلت على +' + ex.earnedThisExam + ' ⭐ في رصيدك!</div>' +
              '</div>' +
              '<div class="grid-2">' +
                '<button type="button" class="btn-primary" id="retryDifferentExam">امتحان مختلف بأسئلة جديدة 🔀</button>' +
                '<button type="button" class="btn-outline" id="backToExamsBtn">العودة للاختبارات</button>' +
              '</div>' +
            '</section>';

          document.getElementById('appMain').innerHTML = html;
          document.getElementById('retryDifferentExam').onclick = function () {
            startExam(ex.title + ' (متجدد)', ex.pool, ex.limit, ex.mode, ex.subjectId, ex.lessonId);
          };
          document.getElementById('backToExamsBtn').onclick = function () { ui.examState = null; ui.view = 'exams'; render(); };
          return;
        }

        var q = ex.questions[ex.index];
        var chosenIdx = ex.answers[ex.index];
        var answered = typeof chosenIdx === 'number';
        var letters = ['أ', 'ب', 'ج', 'د'];

        var html =
          '<section class="card">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">' +
              '<button type="button" class="btn-outline" id="exitExamBtn">✕ إنهاء</button>' +
              '<span style="font-size:12.5px;font-weight:800;">سؤال <span class="font-math tabular">' + (ex.index + 1) + ' / ' + ex.questions.length + '</span></span>' +
              '<span class="filter-pill active font-math tabular">+' + ex.earnedThisExam + ' ⭐</span>' +
            '</div>' +
            '<div class="progress-track" style="margin-top:10px;"><div class="progress-fill" style="width:' + Math.round(((ex.index + 1) / ex.questions.length) * 100) + '%;"></div></div>' +
            '<div style="margin-top:12px;">' +
              '<span class="filter-pill" style="font-size:11px;">' + escapeHtml(q.skill) + '</span>' +
              '<h3 style="margin:10px 0 6px;font-size:16px;font-weight:900;line-height:1.65;">' + escapeHtml(q.prompt) + '</h3>' +
              (q.math ? '<div class="math-box font-math">' + escapeHtml(q.math) + '</div>' : '') +
            '</div>' +
            '<div>' +
              q.options.map(function (opt, idx) {
                var cls = 'option-btn';
                if (answered) {
                  if (idx === q.correctIndex) cls += ' correct';
                  else if (idx === chosenIdx) cls += ' wrong';
                }
                return '<button type="button" class="' + cls + '" ' + (answered ? 'disabled' : '') + ' data-opt="' + idx + '">' +
                  '<span class="option-letter">' + letters[idx] + '</span>' +
                  '<span>' + escapeHtml(opt) + '</span>' +
                '</button>';
              }).join('') +
            '</div>' +
            (answered
              ? '<div class="explanation-box">' +
                  (chosenIdx === q.correctIndex ? '✅ إجابة صحيحة! +5 ⭐ — ' : '❌ إجابة خاطئة — ') +
                  escapeHtml(q.explanation) +
                '</div>' +
                '<div style="margin-top:12px;display:flex;justify-content:flex-end;">' +
                  '<button type="button" class="btn-primary" id="nextQuestionBtn">' +
                    (ex.index + 1 < ex.questions.length ? 'السؤال التالي ←' : 'عرض النتيجة النهائية 🏆') +
                  '</button>' +
                '</div>'
              : '') +
          '</section>';

        document.getElementById('appMain').innerHTML = html;

        document.getElementById('exitExamBtn').onclick = function () { ui.examState = null; ui.view = 'exams'; render(); };
        document.querySelectorAll('[data-opt]').forEach(function (b) {
          b.onclick = function () {
            if (typeof ex.answers[ex.index] === 'number') return;
            var picked = Number(b.getAttribute('data-opt'));
            ex.answers[ex.index] = picked;
            if (picked === q.correctIndex) {
              state.points += 5;
              ex.earnedThisExam += 5;
              showToast('إجابة صحيحة! +5 ⭐');
              saveState();
            }
            render();
          };
        });
        var nextBtn = document.getElementById('nextQuestionBtn');
        if (nextBtn) {
          nextBtn.onclick = function () {
            if (ex.index + 1 < ex.questions.length) {
              ex.index++;
            } else {
              ex.finished = true;
              state.examsTaken += 1;
              var right = 0;
              ex.questions.forEach(function (qq, i) { if (ex.answers[i] === qq.correctIndex) right++; });
              var pct = Math.round((right / ex.questions.length) * 100);
              if (pct > state.bestScorePct) state.bestScorePct = pct;
              if (ex.lessonId && pct >= 60) state.completedLessons[ex.lessonId] = true;
              saveState();
            }
            render();
          };
        }
      }

      function renderLeaderboard() {
        var list = getLeaderboard();
        var myRank = getMyRank();
        var html =
          '<section class="card">' +
            '<div class="section-title">' +
              '<span>🏆 سباق المركز الأول — TOP KEMO</span>' +
              '<button type="button" class="btn-primary" id="editNameBtn">' + (state.studentName ? 'تعديل اسمي' : 'سجّل اسمك +20 ⭐') + '</button>' +
            '</div>' +
            '<p style="margin:0 0 10px;font-size:12.5px;color:var(--muted);font-weight:700;">' +
              'ترتيبك الحالي: <strong style="color:var(--accent);">#' + myRank + '</strong> برصيد <strong class="font-math">' + state.points + ' ⭐</strong> (كل سؤال صح يزودك 5 نقط).' +
            '</p>' +
            list.map(function (row, idx) {
              var medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);
              return '<div class="leader-row ' + (row.isMe ? 'me' : '') + '">' +
                '<div style="display:flex;align-items:center;gap:10px;">' +
                  '<span class="rank-num">' + medal + '</span>' +
                  '<span style="font-size:20px;">' + escapeHtml(row.avatar) + '</span>' +
                  '<div>' +
                    '<div style="font-size:13.5px;font-weight:900;">' + escapeHtml(row.name) + (row.isMe ? ' (أنت)' : '') + '</div>' +
                    '<div style="font-size:11px;color:var(--muted);font-weight:700;">' + row.exams + ' امتحان</div>' +
                  '</div>' +
                '</div>' +
                '<div class="font-math tabular" style="font-size:14px;font-weight:900;color:#d97706;">' + row.points + ' ⭐</div>' +
              '</div>';
            }).join('') +
          '</section>';
        document.getElementById('appMain').innerHTML = html;
        document.getElementById('editNameBtn').onclick = function () { openNameModal(false); };
      }

      function renderProfile() {
        var html =
          '<section class="card" style="text-align:center;">' +
            '<div style="font-size:48px;">' + escapeHtml(state.studentAvatar || '🎓') + '</div>' +
            '<h2 style="margin:6px 0 2px;font-size:19px;font-weight:900;">' + escapeHtml(state.studentName || 'طالب TOP KEMO') + '</h2>' +
            '<div style="font-size:13px;color:var(--accent);font-weight:800;">' + getRankTitle(state.points) + '</div>' +
            '<div class="grid-3" style="margin-top:14px;">' +
              '<div class="unit-box" style="margin-top:0;"><div class="font-math tabular" style="font-size:20px;font-weight:900;color:#d97706;">' + state.points + ' ⭐</div><div style="font-size:11px;color:var(--muted);font-weight:700;">إجمالي النقاط</div></div>' +
              '<div class="unit-box" style="margin-top:0;"><div class="font-math tabular" style="font-size:20px;font-weight:900;color:var(--accent);">' + state.examsTaken + '</div><div style="font-size:11px;color:var(--muted);font-weight:700;">الامتحانات</div></div>' +
              '<div class="unit-box" style="margin-top:0;"><div class="font-math tabular" style="font-size:20px;font-weight:900;">' + getOverallProgressPct() + '%</div><div style="font-size:11px;color:var(--muted);font-weight:700;">إنجاز المنهج</div></div>' +
            '</div>' +
            '<div class="grid-2" style="margin-top:14px;">' +
              '<button type="button" class="btn-primary" id="profEditBtn">تعديل الاسم والشخصية</button>' +
              '<button type="button" class="btn-outline" id="profApkBtn">📲 تنزيل التطبيق APK</button>' +
            '</div>' +
            '<button type="button" class="btn-outline" id="resetProgressBtn" style="margin-top:10px;width:100%;color:#ef4444;">إعادة تعيين التقدم والنقاط</button>' +
          '</section>';
        document.getElementById('appMain').innerHTML = html;
        document.getElementById('profEditBtn').onclick = function () { openNameModal(false); };
        document.getElementById('profApkBtn').onclick = openApkModal;
        document.getElementById('resetProgressBtn').onclick = function () {
          state.points = 0;
          state.completedLessons = {};
          state.examsTaken = 0;
          state.bestScorePct = 0;
          saveState();
          showToast('تم تصفير التقدم');
          render();
        };
      }

      function renderNotifications() {
        var html =
          '<section class="card">' +
            '<div class="section-title"><span>🔔 التنبيهات التفاعلية</span><button type="button" class="btn-outline" id="backFromNotif">رجوع</button></div>' +
            state.notifications.map(function (n) {
              return '<div class="unit-box">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;"><strong style="font-size:13.5px;">' + escapeHtml(n.title) + '</strong><span style="font-size:11px;color:var(--muted);">' + escapeHtml(n.time) + '</span></div>' +
                '<p style="margin:5px 0 0;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.6;">' + escapeHtml(n.body) + '</p>' +
              '</div>';
            }).join('') +
          '</section>';
        document.getElementById('appMain').innerHTML = html;
        document.getElementById('backFromNotif').onclick = function () { ui.view = 'home'; render(); };
      }

      function render() {
        document.body.setAttribute('data-theme', state.themeId || 'coral');
        renderHeader();
        renderBottomNav();
        if (ui.view === 'home') renderHome();
        else if (ui.view === 'lessons') renderLessons();
        else if (ui.view === 'lesson-detail') renderLessonDetail();
        else if (ui.view === 'exams') renderExamsHub();
        else if (ui.view === 'exam-runner') renderExamRunner();
        else if (ui.view === 'leaderboard') renderLeaderboard();
        else if (ui.view === 'profile') renderProfile();
        else if (ui.view === 'notifications') renderNotifications();
      }

      document.getElementById('modalBackdrop').onclick = function (e) {
        if (e.target === this) this.classList.remove('open');
      };

      render();
      if (!state.studentName) {
        setTimeout(function () { openNameModal(false); }, 450);
      }
    })();
  </script>
</body>
</html>
